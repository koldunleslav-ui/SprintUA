<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SprintUA Lottery</title>
    <link rel="manifest" href="tonconnect-manifest.json">
    <meta name="theme-color" content="#2563eb">
    
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 24px;
            text-align: center;
        }
        p {
            color: #94a3b8;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }
        .tickets-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-width: 400px;
            width: 100%;
            margin-bottom: 20px;
        }
        .ticket {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 10px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: #94a3b8;
            user-select: none;
        }
        .ticket.revealed-win {
            background-color: #10b981;
            border-color: #059669;
            color: #ffffff;
        }
        .ticket.revealed-lose {
            background-color: #334155;
            border-color: #475569;
            color: #64748b;
        }
        .buy-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
            margin-bottom: 15px;
            width: 100%;
            max-width: 300px;
        }
        .buy-btn:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
        }
        .status-message {
            font-size: 15px;
            font-weight: bold;
            margin-top: 10px;
            text-align: center;
            min-height: 24px;
        }
        .reset-btn {
            background-color: #334155;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <div id="wallet-container"></div>
    </div>

    <h1>Фортуна SprintUA 🎟</h1>
    <p>Випробуй удачу! Обери свій щасливий квиток.</p>

    <div class="tickets-grid" id="grid"></div>

    <button class="buy-btn" id="buyBtn" onclick="buyTicket()">Купити квиток (0.001 TON)</button>
    
    <div class="status-message" id="status"></div>
    <button class="reset-btn" id="resetBtn" onclick="resetGame()">Спробувати ще раз</button>

    <!-- Підключення бібліотеки TON Connect UI -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script>
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://koldunleslav-ui.github.io/SprintUA/tonconnect-manifest.json',
            buttonRootId: 'wallet-container'
        });

        // Ваша реальна адреса гаманця для отримання коштів
        const myWalletAddress = "UQAW61rqX6gJLIzO_opjyxTtrMB9Z9q1k1mFpTcgPcDAr5cz";

        const TOTAL_TICKETS = 10;
        let ticketsState = Array(TOTAL_TICKETS).fill(false);
        let winningIndex = Math.floor(Math.random() * TOTAL_TICKETS);
        let openedCount = 0;
        let gameOver = false;

        const gridElement = document.getElementById('grid');
        const statusElement = document.getElementById('status');
        const buyBtn = document.getElementById('buyBtn');
        const resetBtn = document.getElementById('resetBtn');

        function initGrid() {
            gridElement.innerHTML = '';
            for (let i = 0; i < TOTAL_TICKETS; i++) {
                const ticket = document.createElement('div');
                ticket.className = 'ticket';
                ticket.id = `ticket-${i}`;
                ticket.innerText = `#${i + 1}`;
                gridElement.appendChild(ticket);
            }
        }

        async function buyTicket() {
            if (gameOver) return;

            if (!tonConnectUI.connected) {
                alert('Будь ласка, підключіть гаманець угорі праворуч!');
                return;
            }

            let closedIndices = [];
            for (let i = 0; i < TOTAL_TICKETS; i++) {
                if (!ticketsState[i]) closedIndices.push(i);
            }

            if (closedIndices.length === 0) return;

            buyBtn.disabled = true;
            statusElement.style.color = '#38bdf8';
            statusElement.innerText = 'Підтвердьте транзакцію в гаманці (0.001 TON)...';

            try {
                const transaction = {
                    validUntil: Math.floor(Date.now() / 1000) + 300,
                    messages: [
                        {
                            address: myWalletAddress, 
                            amount: "1000000" // 0.001 TON у нанотонах
                        }
                    ]
                };

                // Відправка реальної транзакції через TON Connect
                const result = await tonConnectUI.sendTransaction(transaction);

                const randomIndex = Math.floor(Math.random() * closedIndices.length);
                const chosenTicketIndex = closedIndices[randomIndex];

                ticketsState[chosenTicketIndex] = true;
                openedCount++;

                const ticketElement = document.getElementById(`ticket-${chosenTicketIndex}`);

                if (chosenTicketIndex === winningIndex) {
                    ticketElement.classList.add('revealed-win');
                    ticketElement.innerText = '🎁 WIN';
                    statusElement.style.color = '#10b981';
                    statusElement.innerText = '🎉 Вітаємо! Ви виграли!';
                    endGame(true);
                } else {
                    ticketElement.classList.add('revealed-lose');
                    ticketElement.innerText = '❌';
                    statusElement.style.color = '#94a3b8';
                    statusElement.innerText = `Квиток #${chosenTicketIndex + 1} порожній. Спробуйте ще!`;
                    
                    if (openedCount === TOTAL_TICKETS) {
                        endGame(false);
                    } else {
                        buyBtn.disabled = false;
                    }
                }

            } catch (error) {
                console.error(error);
                statusElement.style.color = '#ef4444';
                statusElement.innerText = 'Транзакцію скасовано.';
                buyBtn.disabled = false;
            }
        }

        function endGame(isWin) {
            gameOver = true;
            buyBtn.style.display = 'none';
            resetBtn.style.display = 'block';
        }

        function resetGame() {
            winningIndex = Math.floor(Math.random() * TOTAL_TICKETS);
            ticketsState = Array(TOTAL_TICKETS).fill(false);
            openedCount = 0;
            gameOver = false;
            statusElement.innerText = '';
            resetBtn.style.display = 'none';
            buyBtn.style.display = 'block';
            buyBtn.disabled = false;
            initGrid();
        }

        initGrid();
    </script>
</body>
</html>
