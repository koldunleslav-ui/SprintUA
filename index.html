<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SprintUA Game</title>
    <!-- Підключення маніфесту -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            text-align: center;
        }
        h1 {
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            margin-bottom: 30px;
        }
        #wallet-container {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SprintUA</h1>
        <p>Готуйтеся до забігу та підключіть гаманець!</p>
        
        <!-- Кнопка та контейнер для гаманця TON Connect -->
        <div id="wallet-container"></div>
    </div>

    <!-- Підключення бібліотеки TON Connect UI -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script>
        // Ініціалізація віджета гаманця
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://koldunleslav-ui.github.io/SprintUA/manifest.json',
            buttonRootId: 'wallet-container'
        });
    </script>
</body>
</html>
