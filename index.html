<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Радіо Удвох - Доступ до ефіру</title>
    <link rel="manifest" href="tonconnect-manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .header {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .card {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 30px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: #f8fafc;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .action-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
            width: 100%;
            transition: transform 0.1s;
        }
        .action-btn:active {
            transform: scale(0.97);
        }
        .action-btn:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
        }
        .player-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .radio-icon {
            font-size: 48px;
            margin-bottom: 5px;
        }
        .status-text {
            font-size: 14px;
            color: #38bdf8;
            margin-top: 15px;
            min-height: 20px;
        }
        /* Анімація хвиль ефіру */
        .waves {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 30px;
            margin: 10px 0;
        }
        .wave {
            width: 4px;
            height: 100%;
            background-color: #38bdf8;
            border-radius: 2px;
            animation: pulse 1s infinite ease-in-out;
        }
        .wave:nth-child(2) { animation-delay: 0.2s; }
        .wave:nth-child(3) { animation-delay: 0.4s; }
        .wave:nth-child(4) { animation-delay: 0.6s; }

        @keyframes pulse {
            0%, 100% { transform: scaleY(0.3); }
            50% { transform: scaleY(1); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div id="wallet-container"></div>
    </div>

    <div class="card">
        <!-- ЕКРАН БЛОКУВАННЯ (PAYWALL) -->
        <div id="lock-screen">
            <div class="radio-icon">🎙️</div>
            <h1>Радіо Удвох</h1>
            <p>Отримайте ексклюзивний доступ до прямого ефіру (пісні, поезія, радіограй) всього за 0.001 TON.</p>
            <button class="action-btn" id="payBtn" onclick="payForAccess()">Сплатити 0.001 TON</button>
        </div>

        <!-- РОЗБЛОКОВАНИЙ ПЛЕЄР -->
        <div id="player-screen" class="player-container">
            <div class="radio-icon">📻</div>
            <h1>У ефірі: Радіо Удвох</h1>
            
            <div class="waves">
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
            </div>

            <audio id="audioStream" controls style="width: 100%; margin-top: 10px;">
                <source src="https://listen4.myradio24.com/78073" type="audio/mpeg">
                Ваш браузер не підтримує аудіопотік.
            </audio>
            <p style="color: #10b981; font-size: 13px; margin: 5px 0 0 0;">✔ Доступ активовано</p>
        </div>

        <div class="status-text" id="status"></div>
    </div>

    <!-- Підключення бібліотеки TON Connect UI -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script>
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://koldunleslav-ui.github.io/SprintUA/tonconnect-manifest.json',
            buttonRootId: 'wallet-container',
            actionsConfiguration: {
                twaReturnUrl: 'https://koldunleslav-ui.github.io/SprintUA/'
            }
        });

        // Ваша адреса для отримання коштів
        const myWalletAddress = "UQAW61rqX6gJLIzO_opjyxTtrMB9Z9q1k1mFpTcgPcDAr5cz";

        const payBtn = document.getElementById('payBtn');
        const statusElement = document.getElementById('status');
        const lockScreen = document.getElementById('lock-screen');
        const playerScreen = document.getElementById('player-screen');
        const audioStream = document.getElementById('audioStream');

        async function payForAccess() {
            if (!tonConnectUI.connected) {
                alert('Будь ласка, підключіть гаманець у правому верхньому кутку!');
                return;
            }

            payBtn.disabled = true;
            statusElement.innerText = 'Підтвердьте транзакцію в гаманці...';

            try {
                const transaction = {
                    validUntil: Math.floor(Date.now() / 1000) + 300,
                    messages: [
                        {
                            address: myWalletAddress, 
                            amount: "1000000" // 0.001 TON у нанотонах
                        }
                    ]
                };

                // Запит на реальну транзакцію
                await tonConnectUI.sendTransaction(transaction);

                // Якщо все успішно — приховуємо екран оплати і показуємо плеєр
                statusElement.innerText = '';
                lockScreen.style.display = 'none';
                playerScreen.style.display = 'flex';

                // Автоматичний запуск потоку (де дозволено браузерами)
                audioStream.play().catch(e => console.log("Автозапуск заблоковано браузером, натисніть Play."));

            } catch (error) {
                console.error(error);
                statusElement.style.color = '#ef4444';
                statusElement.innerText = 'Транзакцію скасовано.';
                payBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
